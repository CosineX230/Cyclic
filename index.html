<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collatz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="title">Collatz Pattern Generator</div>

    <div class="rule_section">
        <div class="rule_number">
            <label for="customNumber">Enter the number of relations:  </label>
            <input type="number" id="quantity" name="quantity"
                min="2" max="3" step="1" value="2">
        </div>
        <div class="rules" id="rules"></div>
        <script src="ruleset.js"></script>
    </div>
    
    <div class="sequence">
        <div class="input">
            <label for="input">Enter starting seed:  </label>
            <input type="number" id="input" name="input"
                step="1" value="1">
            <input type="button" id="button" onclick="handleSubmit()" value="Generate Terms">
            <script src="script.js"></script>
        </div>
        <div class="output">
            <textarea id="output" class="output-box" readonly></textarea>
        </div>
    </div>
</body>
</html>
